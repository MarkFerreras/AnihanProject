# ==============================
# Application
# ==============================
spring.application.name=springboot

# Render (and other hosts) inject the listen port via $PORT; 8080 is the
# local-dev / on-premise default.
server.port=${PORT:8080}

# Honor X-Forwarded-* headers from Render's edge proxy so
# HttpServletRequest#getRemoteAddr() (used throughout system_logs auditing)
# resolves to the real client IP instead of the proxy's.
server.forward-headers-strategy=native

# ==============================
# DataSource — MySQL 8
# ==============================
# Defaults target the local Docker MySQL used for on-premise dev; override
# with real env vars for any other deployment target (e.g. Render).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/AnihanSRMS}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:my_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# File Storage
# ==============================
# Unused since 2026-09-19: StorageService was removed with the student-portal
# upload feature. Retained for a future feature that needs a storage location.
app.storage.root=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==============================
# Session
# ==============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
