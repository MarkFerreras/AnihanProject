# ==============================
# Application
# ==============================
spring.application.name=springboot

# ==============================
# Server
# Render (and most PaaS hosts) inject the port to bind via $PORT.
# Falls back to 8080 for local development.
# ==============================
server.port=${PORT:8080}

# ==============================
# DataSource — MySQL 8
# Local dev defaults to Docker MySQL; cloud deploys (Render + Aiven)
# override these via environment variables. The Aiven connection string
# requires SSL — set DB_URL to the Aiven URL including ?sslMode=REQUIRE.
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/AnihanSRMS}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:my_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# File Storage
# NOTE: uploaded files currently live on the local filesystem. On Render
# the filesystem is EPHEMERAL — files are lost on every restart/redeploy.
# For persistence, either mount a Render Disk and point STORAGE_ROOT at it,
# or migrate uploads to DB BLOB storage (see deploy guide / follow-ups).
# ==============================
app.storage.root=${STORAGE_ROOT:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==============================
# Session
# COOKIE_SECURE should be true in production (HTTPS) and false for local
# HTTP development. Render serves over HTTPS, so set COOKIE_SECURE=true there.
# ==============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
