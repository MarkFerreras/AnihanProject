<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anihan SRMS — Answer Security Questions">
    <title>Answer Security Questions — Anihan SRMS</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header>
        <nav class="navbar login-navbar">
            <div class="container">
                <span class="navbar-brand">
                    <img src="images/logo.png" alt="Anihan Logo" class="navbar-logo">
                </span>
            </div>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card">
            <h1 class="login-card-title">Answer Security Questions</h1>
            <p class="login-card-subtitle">Both answers must be correct to continue.</p>

            <div class="alert alert-danger d-none" id="verifyError" role="alert"></div>

            <form id="verifyForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold" id="questionLabel1"></label>
                    <input type="text" class="form-control" id="answer1" maxlength="100" required autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" id="questionLabel2"></label>
                    <input type="text" class="form-control" id="answer2" maxlength="100" required autocomplete="off">
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-login" id="verifyButton">Continue</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="index.html">Back to Log In</a>
            </div>
        </div>
    </main>

    <footer class="login-footer">
        <div class="container">
            <span>&copy; 2026 Anihan SRMS. All rights reserved.</span>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/forgot-password-questions.js"></script>
</body>

</html>
