<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anihan SRMS — Reset Password">
    <title>Reset Password — Anihan SRMS</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header>
        <nav class="navbar login-navbar">
            <div class="container">
                <span class="navbar-brand">
                    <img src="images/logo.png" alt="Anihan Logo" class="navbar-logo">
                </span>
            </div>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card">
            <h1 class="login-card-title">Reset Password</h1>
            <p class="login-card-subtitle">Choose a new password for your account.</p>

            <div class="alert alert-danger d-none" id="resetError" role="alert"></div>

            <form id="resetForm">
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" autocomplete="new-password" minlength="8" required>
                    <div class="form-text">Min 8 characters, with uppercase, lowercase, number, and special character.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmNewPassword" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-login" id="resetButton">Reset Password</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="login-footer">
        <div class="container">
            <span>&copy; 2026 Anihan SRMS. All rights reserved.</span>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/reset-password.js"></script>
</body>

</html>
