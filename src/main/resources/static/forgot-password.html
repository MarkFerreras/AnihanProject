<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anihan SRMS — Forgot Password">
    <title>Forgot Password — Anihan SRMS</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header>
        <nav class="navbar login-navbar">
            <div class="container">
                <span class="navbar-brand">
                    <img src="images/logo.png" alt="Anihan Logo" class="navbar-logo">
                </span>
            </div>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card">
            <h1 class="login-card-title">Forgot Password</h1>
            <p class="login-card-subtitle">Enter the email address on your account to continue.</p>

            <div class="alert alert-danger d-none" id="lookupError" role="alert"></div>

            <form id="lookupForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-login" id="lookupButton">Continue</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="index.html">Back to Log In</a>
            </div>
        </div>
    </main>

    <footer class="login-footer">
        <div class="container">
            <span>&copy; 2026 Anihan SRMS. All rights reserved.</span>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/forgot-password.js"></script>
</body>

</html>
